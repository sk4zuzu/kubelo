---
- ansible.builtin.set_fact:
    initial_advertise_peer_urls: >-
      https://{{ ansible_default_ipv4.address }}:2380
    listen_peer_urls: >-
      https://{{ ansible_default_ipv4.address }}:2380
    listen_client_urls: >-
      https://{{ ansible_default_ipv4.address }}:2379,http://127.0.0.1:2379
    advertise_client_urls: >-
      https://{{ ansible_default_ipv4.address }}:2379
    initial_cluster: >-
      {{ etcd_hosts | zip(etcd_ipv4s | map('regex_replace', '^(.*)$', 'https://\g<1>:2380'))
                    | map('join', '=')
                    | join(',') }}

- name: render templates
  ansible.builtin.template:
    dest: "/{{ item }}"
    src: "{{ item }}.j2"
    owner: 0
    group: 0
    mode: u=rw,go=r
  loop:
    - etc/etcd/etcd.yml
  notify:
    - restart etcd
