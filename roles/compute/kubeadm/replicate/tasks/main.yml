---
- name: push token/hash from local cache
  ansible.posix.synchronize:
    mode: push
    src: "{{ playbook_dir }}/.tmp/{{ cluster_name }}/etc/kubernetes/"
    dest: /etc/kubernetes/
    owner: false
    group: false
    checksum: true
    times: false
    use_ssh_args: true
    rsync_opts:
      - --include=TOKEN
      - --include=HASH
      - --exclude=*
