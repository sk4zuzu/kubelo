---
- name: enable kubelet service
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: initialize kubernetes cluster
  ansible.builtin.shell:
    creates: "{{ item.creates | d(omit) }}"
    cmd: |
      set -eu -o pipefail
      {{ item.cmd }}
    executable: /bin/bash
  environment: "{{ item.environment | d({}) }}"
  loop:
    - creates: /etc/kubernetes/admin.conf
      cmd: |
        kubeadm init \
          --config=/etc/kubernetes/kubeadm.yml
    - creates: /etc/kubernetes/TOKEN
      cmd: |
        kubeadm token create \
          --ttl=0 \
          --groups='system:bootstrappers:kubeadm:default-node-token' \
        | install -m u=rw,go=r -o 0 -g 0 /dev/fd/0 /etc/kubernetes/TOKEN
    - creates: /etc/kubernetes/HASH
      cmd: |
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
        | openssl rsa -pubin -outform der \
        | openssl dgst -sha256 -hex \
        | awk '/stdin/{print$2}' \
        | install -m u=rw,go=r -o 0 -g 0 /dev/fd/0 /etc/kubernetes/HASH
    - creates: /etc/kubernetes/kube-flannel.yml.DONE
      cmd: |
        kubectl apply \
          --filename=/etc/kubernetes/kube-flannel.yml
        touch /etc/kubernetes/kube-flannel.yml.DONE
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
    - creates: /etc/kubernetes/kube-vip-cloud-controller.yaml.DONE
      cmd: |
        kubectl create configmap \
          --namespace=kube-system \
          --from-literal range-global='{{ kubevip_range_global }}' \
          kubevip
        kubectl apply \
          --filename=/etc/kubernetes/kube-vip-cloud-controller.yaml
        touch /etc/kubernetes/kube-vip-cloud-controller.yaml.DONE
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
